<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل جديد - PR Per Hour</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }
        
        .register-container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
        }
        
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .logo img {
            max-width: 200px;
        }
        
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }
        
        /* صف الأسماء الثلاثة */
        .name-row {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .name-field {
            flex: 1;
            min-width: 0;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: 500;
        }
        
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            box-sizing: border-box;
        }
        
        input:focus {
            outline: none;
            border-color: #C4860B;
            box-shadow: 0 0 0 3px rgba(196, 134, 11, 0.1);
        }
        
        button {
            width: 100%;
            padding: 12px;
            background: #C4860B;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        button:hover {
            background: #8B5D00;
        }
        
        .links {
            text-align: center;
            margin-top: 20px;
        }
        
        .links a {
            color: #C4860B;
            text-decoration: none;
        }
        
        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        
        .required:after {
            content: " *";
            color: red;
        }
        
        /* للجوال */
        @media (max-width: 600px) {
            .register-container {
                padding: 25px;
            }
            .name-row {
                flex-direction: column;
                gap: 15px;
            }
            .name-field {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="logo">
            <img src="../images/logo.png" alt="PR Per Hour" onerror="this.src='https://via.placeholder.com/200x100/C4860B/ffffff?text=PR'">
        </div>
        <h2>تسجيل جديد</h2>

        <!-- رسالة خطأ تجريبية (مخفية) 
        <div class="error">
            البريد الإلكتروني مستخدم بالفعل
        </div>
        -->

        <form id="registerForm">
            <!-- صف الأسماء الثلاثة (على نفس المستوى) -->
            <div class="name-row">
                <div class="name-field">
                    <label class="required">الاسم الأول</label>
                    <input type="text" name="first_name" id="first_name" required>
                </div>
                
                <div class="name-field">
                    <label class="required">اسم الأب</label>
                    <input type="text" name="father_name" id="father_name" required>
                </div>
                
                <div class="name-field">
                    <label class="required">الاسم الأخير</label>
                    <input type="text" name="last_name" id="last_name" required>
                </div>
            </div>
            
            <div class="form-group">
                <label class="required">البريد الإلكتروني</label>
                <input type="email" name="email" id="email" required>
            </div>
            
            <div class="form-group">
                <label class="required">كلمة المرور</label>
                <input type="password" name="password" id="password" required>
            </div>
            
            <div class="form-group">
                <label class="required">تأكيد كلمة المرور</label>
                <input type="password" name="password_confirmation" id="password_confirmation" required>
            </div>
            
            <button type="submit">تسجيل</button>
        </form>
        
        <div class="links">
            <a href="login.html">لديك حساب؟ سجل دخولك</a>
        </div>
    </div>

    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const password = document.getElementById('password').value;
            const passwordConfirm = document.getElementById('password_confirmation').value;
            
            if (password !== passwordConfirm) {
                alert('كلمة المرور وتأكيدها غير متطابقين');
                return;
            }
            
            const userData = {
                first_name: document.getElementById('first_name').value,
                father_name: document.getElementById('father_name').value,
                last_name: document.getElementById('last_name').value,
                email: document.getElementById('email').value,
                password: password
            };
            
            const result = await register(userData);
            
            if (result.success) {
                alert('تم التسجيل بنجاح');
                window.location.href = '../index.html';
            } else {
                alert(result.message || 'حدث خطأ في التسجيل');
            }
        });
    </script>
</body>
</html>
